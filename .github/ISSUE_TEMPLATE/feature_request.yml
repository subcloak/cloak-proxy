name: Feature request
description: Something Cloak Proxy should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, not the solution. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: other
    attributes:
      label: Does another tool do this well?
      placeholder: "Charles, Proxyman, HTTP Toolkit, mitmproxy, Postman..."
